<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - BOLI AI 批量生图</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .admin-login {
            max-width: 420px;
            margin: 100px auto;
            text-align: center;
        }
        .admin-login h2 {
            margin-bottom: 24px;
            color: var(--text-primary);
        }
        .admin-login .subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 28px;
        }
        .admin-login input {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 15px;
            box-sizing: border-box;
            margin-bottom: 16px;
        }
        .admin-login input:focus {
            border-color: var(--accent);
            outline: none;
        }
        .admin-login .error-msg {
            color: #ef4444;
            font-size: 14px;
            margin-bottom: 12px;
            min-height: 20px;
        }

        .admin-panel { display: none; }
        .admin-panel.active { display: block; }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .admin-header h2 {
            color: var(--text-primary);
            margin: 0;
        }
        .admin-header .badge {
            background: var(--accent);
            color: #fff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
        }

        .users-table-wrap {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
        }
        .users-table {
            width: 100%;
            border-collapse: collapse;
        }
        .users-table th {
            background: rgba(59, 130, 246, 0.08);
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 13px;
            text-align: left;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
        }
        .users-table td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
            font-size: 14px;
            vertical-align: middle;
        }
        .users-table tr:last-child td {
            border-bottom: none;
        }
        .users-table tr:hover td {
            background: rgba(59, 130, 246, 0.03);
        }

        .balance-control {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .balance-control > * {
            flex: 0 0 auto;
            white-space: nowrap;
        }
        .balance-control input {
            width: 80px;
            padding: 6px 10px;
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 13px;
            text-align: center;
        }
        .balance-control input:focus {
            border-color: var(--accent);
            outline: none;
        }
        .balance-control .btn-sm {
            padding: 6px 12px;
            font-size: 13px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-set {
            background: var(--accent);
            color: #fff;
        }
        .btn-set:hover {
            background: var(--accent-hover);
        }
        .btn-add {
            background: #10b981;
            color: #fff;
        }
        .btn-add:hover {
            background: #059669;
        }
        .btn-del {
            background: #ef4444;
            color: #fff;
        }
        .btn-del:hover {
            background: #dc2626;
        }
        .btn-reset {
            background: #f59e0b;
            color: #fff;
        }
        .btn-reset:hover {
            background: #d97706;
        }

        .toast {
            position: fixed;
            top: 24px;
            right: 24px;
            padding: 12px 20px;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            z-index: 1000;
            opacity: 0;
            transform: translateY(-12px);
            transition: all 0.3s;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }
        .toast.success { background: #10b981; }
        .toast.error { background: #ef4444; }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }
        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.4;
        }

        @media (max-width: 768px) {
            .balance-control input { width: 60px; }
            .users-table th, .users-table td { padding: 10px 12px; font-size: 13px; }
        }
    </style>
</head>
<body>
    <div class="glass-bg"></div>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <div class="container">

        <!-- 登录 -->
        <div id="loginBox" class="admin-login glass-card">
            <h2><i data-lucide="shield" class="lucide-icon"></i> 管理后台</h2>
            <div class="subtitle">请输入管理员密钥进行身份验证</div>
            <div class="error-msg" id="loginError"></div>
            <input type="password" id="adminKeyInput" placeholder="请输入管理员密钥" autofocus>
            <button class="btn btn-primary" id="loginBtn" style="width:100%">验证身份</button>
            <div style="margin-top:16px;font-size:13px;color:var(--text-secondary)">
                <a href="login.html" style="color:var(--accent);text-decoration:none">← 返回用户登录</a>
            </div>
        </div>

        <!-- 管理面板 -->
        <div id="adminPanel" class="admin-panel">
            <div class="admin-header">
                <div>
                    <h2><i data-lucide="users" class="lucide-icon"></i> 用户管理</h2>
                    <div style="color:var(--text-secondary);font-size:13px;margin-top:4px">
                        已连接管理员
                        <span class="badge" style="margin-left:8px">●</span>
                    </div>
                </div>
                <button class="btn btn-secondary" id="refreshBtn" style="padding:8px 18px"><i data-lucide="refresh-cw" class="lucide-icon"></i> 刷新</button>
            </div>

            <div class="users-table-wrap">
                <div id="loadingState" class="empty-state">
                    <div class="icon"><i data-lucide="loader" class="lucide-icon lucide-lg lucide-spin"></i></div>
                    <div>加载中...</div>
                </div>
                <div id="tableWrap" style="display:none">
                    <table class="users-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>账号</th>
                                <th>余额（次）</th>
                                <th>注册时间</th>
                                <th style="min-width:240px">操作</th>
                            </tr>
                        </thead>
                        <tbody id="usersBody"></tbody>
                    </table>
                </div>
                <div id="emptyState" class="empty-state" style="display:none">
                    <div class="icon"><i data-lucide="inbox" class="lucide-icon lucide-xl"></i></div>
                    <div>暂无用户</div>
                </div>
            </div>

            <div style="margin-top:20px;text-align:right;font-size:13px;color:var(--text-secondary)">
                <a href="#" id="logoutLink" style="color:var(--accent);text-decoration:none">退出管理后台</a>
            </div>
        </div>

    </div>

    <script src="js/config.js"></script>
    <script>
        // ============================================================
        // 管理后台
        // ============================================================
        const ADMIN_KEY_STORAGE = 'admin_key';

        const loginBox = document.getElementById('loginBox');
        const adminPanel = document.getElementById('adminPanel');
        const adminKeyInput = document.getElementById('adminKeyInput');
        const loginBtn = document.getElementById('loginBtn');
        const loginError = document.getElementById('loginError');
        const refreshBtn = document.getElementById('refreshBtn');
        const usersBody = document.getElementById('usersBody');
        const loadingState = document.getElementById('loadingState');
        const tableWrap = document.getElementById('tableWrap');
        const emptyStateEl = document.getElementById('emptyState');
        const logoutLink = document.getElementById('logoutLink');
        const toast = document.getElementById('toast');

        let adminKey = '';

        function showToast(msg, type = 'success') {
            toast.textContent = msg;
            toast.className = `toast ${type} show`;
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        function getHeaders() {
            return { 'X-Admin-Key': adminKey, 'Content-Type': 'application/json' };
        }

        function showLogin() {
            loginBox.style.display = 'block';
            adminPanel.classList.remove('active');
        }

        function showPanel() {
            loginBox.style.display = 'none';
            adminPanel.classList.add('active');
            loadUsers();
        }

        async function loadUsers() {
            loadingState.style.display = 'block';
            tableWrap.style.display = 'none';
            emptyStateEl.style.display = 'none';

            try {
                const r = await fetch(`${API_BASE}/api/admin/users`, { headers: getHeaders() });
                if (!r.ok) {
                    if (r.status === 403) {
                        localStorage.removeItem(ADMIN_KEY_STORAGE);
                        showLogin();
                        loginError.textContent = '密钥无效，请重新输入';
                        return;
                    }
                    throw new Error(`HTTP ${r.status}`);
                }
                const data = await r.json();
                const users = data.users || [];

                loadingState.style.display = 'none';

                if (users.length === 0) {
                    emptyStateEl.style.display = 'block';
                    return;
                }

                tableWrap.style.display = 'block';
                usersBody.innerHTML = users.map(u => `
                    <tr>
                        <td><code>${u.id}</code></td>
                        <td><strong>${escapeHtml(u.account)}</strong></td>
                        <td><span class="badge" style="background:var(--accent);font-size:14px">${u.balance}</span></td>
                        <td style="color:var(--text-secondary);font-size:13px">${u.created_at || '-'}</td>
                        <td>
                            <div class="balance-control">
                                <input type="number" id="set_${u.id}" placeholder="设余额" min="0">
                                <input type="number" id="add_${u.id}" placeholder="+加次数" min="1">
                                <button class="btn-sm btn-add" onclick="confirmBalance(${u.id})">确定</button>
                                <button class="btn-sm btn-del" onclick="deleteUser(${u.id}, '${escapeHtml(u.account)}')">删除</button>
                                <button class="btn-sm btn-reset" onclick="resetUserPwd(${u.id}, '${escapeHtml(u.account)}')">重置</button>
                            </div>
                        </td>
                    </tr>
                `).join('');

            } catch (e) {
                loadingState.innerHTML = `<div class="icon"><i data-lucide="x-circle" class="lucide-icon lucide-lg"></i></div><div>加载失败：${e.message}</div>`;
            }
        }

        function escapeHtml(s) {
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        async function confirmBalance(userId) {
            const setInput = document.getElementById(`set_${userId}`);
            const addInput = document.getElementById(`add_${userId}`);
            const toNum = (s) => {
                const t = s.trim().replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
                return t === '' ? null : Number(t);
            };
            const setVal = toNum(setInput.value);
            const addVal = toNum(addInput.value);

            if (setVal === null && addVal === null) {
                showToast('请先在"设余额"或"+加次数"中填一个数字', 'error');
                return;
            }
            if (setVal !== null && addVal !== null) {
                showToast('设余额和加次数只能填一个', 'error');
                return;
            }

            try {
                if (setVal !== null) {
                    if (!Number.isFinite(setVal) || setVal < 0) { showToast('请输入有效数字', 'error'); return; }
                    const r = await fetch(`${API_BASE}/api/admin/set_balance`, {
                        method: 'POST',
                        headers: getHeaders(),
                        body: JSON.stringify({ user_id: userId, balance: Math.floor(setVal) })
                    });
                    const data = await r.json();
                    if (!r.ok) throw new Error(data.detail || '操作失败');
                    showToast(`用户 ${data.user_id} 余额已设为 ${data.new_balance}`);
                } else {
                    if (!Number.isFinite(addVal) || addVal < 1) { showToast('请输入有效数字', 'error'); return; }
                    const r = await fetch(`${API_BASE}/api/admin/recharge`, {
                        method: 'POST',
                        headers: getHeaders(),
                        body: JSON.stringify({ user_id: userId, amount: Math.floor(addVal) })
                    });
                    const data = await r.json();
                    if (!r.ok) throw new Error(data.detail || '操作失败');
                    showToast(`用户 ${data.user_id} 增加 ${data.amount} 次，当前余额 ${data.new_balance}`);
                }
                setInput.value = '';
                addInput.value = '';
                loadUsers();
            } catch (e) {
                showToast(`操作失败：${e.message}`, 'error');
            }
        }

        async function resetUserPwd(userId, account) {
            const newPwd = prompt(`请输入「${account}」的新密码（至少 6 位）`);
            if (newPwd === null) return;
            if (newPwd.length < 6) { showToast('密码至少 6 位', 'error'); return; }
            try {
                const r = await fetch(`${API_BASE}/api/admin/reset_password`, {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify({ user_id: userId, new_password: newPwd })
                });
                const data = await r.json();
                if (!r.ok) throw new Error(data.detail || '操作失败');
                showToast(`用户 ${account} 密码已重置`);
            } catch (e) {
                showToast(`重置失败：${e.message}`, 'error');
            }
        }

        async function deleteUser(userId, account) {
            if (!confirm(`确定要删除用户「${account}」(ID=${userId}) 吗？\n该用户的所有任务和扣费记录也会被删除，不可恢复！`)) return;
            try {
                const r = await fetch(`${API_BASE}/api/admin/delete_user`, {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify({ user_id: userId })
                });
                const data = await r.json();
                if (!r.ok) throw new Error(data.detail || '操作失败');
                showToast(`用户 ${account} 已删除`);
                loadUsers();
            } catch (e) {
                showToast(`删除失败：${e.message}`, 'error');
            }
        }

        // 登录
        loginBtn.addEventListener('click', () => {
            const key = adminKeyInput.value.trim();
            if (!key) { loginError.textContent = '请输入管理员密钥'; return; }
            adminKey = key;
            // 先验证密钥有效性
            fetch(`${API_BASE}/api/admin/users`, { headers: { 'X-Admin-Key': adminKey } })
                .then(r => {
                    if (r.status === 403) { loginError.textContent = '密钥无效'; return; }
                    if (!r.ok) throw new Error();
                    localStorage.setItem(ADMIN_KEY_STORAGE, adminKey);
                    loginError.textContent = '';
                    showPanel();
                })
                .catch(() => { loginError.textContent = '连接服务器失败'; });
        });

        adminKeyInput.addEventListener('keydown', e => {
            if (e.key === 'Enter') loginBtn.click();
        });

        // 刷新
        refreshBtn.addEventListener('click', loadUsers);

        // 退出
        logoutLink.addEventListener('click', e => {
            e.preventDefault();
            localStorage.removeItem(ADMIN_KEY_STORAGE);
            adminKey = '';
            adminKeyInput.value = '';
            showLogin();
        });

        // 自动登录
        (function init() {
            const saved = localStorage.getItem(ADMIN_KEY_STORAGE);
            if (saved) {
                adminKey = saved;
                adminKeyInput.value = saved;
                fetch(`${API_BASE}/api/admin/users`, { headers: { 'X-Admin-Key': adminKey } })
                    .then(r => {
                        if (r.ok) { showPanel(); }
                        else { localStorage.removeItem(ADMIN_KEY_STORAGE); showLogin(); }
                    })
                    .catch(() => { showLogin(); });
            } else {
                showLogin();
            }
        })();
    </script>
</body>
</html>
